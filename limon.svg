<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Limón" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fondo verde con esquinas redondeadas -->
  <rect width="200" height="200" rx="40" fill="#1d7a4a"/>
  <g transform="rotate(-25 100 110)">
    <!-- Puntas del limón -->
    <ellipse cx="34" cy="110" rx="10" ry="8" fill="#ffe14a" stroke="#d9a800" stroke-width="4"/>
    <ellipse cx="166" cy="110" rx="10" ry="8" fill="#ffe14a" stroke="#d9a800" stroke-width="4"/>
    <!-- Cuerpo -->
    <ellipse cx="100" cy="110" rx="66" ry="46" fill="#ffe14a" stroke="#d9a800" stroke-width="4"/>
    <!-- Brillo -->
    <ellipse cx="78" cy="92" rx="24" ry="8" fill="#fff6a8" opacity="0.85"/>
  </g>
  <!-- Hoja -->
  <path d="M138 52 Q165 28 182 48 Q160 68 138 52 Z" fill="#3fbf5f" stroke="#155c2c" stroke-width="3"/>
